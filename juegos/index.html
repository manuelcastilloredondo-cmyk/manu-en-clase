<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juegos · Manu en clase</title>
<meta name="description" content="Juegos de aula gratuitos de Manu en clase, para pizarra digital y tablet.">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f3a44;--azul:#4497b0;--azul-hondo:#2d6f85;--coral:#fa6876;--celeste:#d4eff7;--nube:#f3fafc;--line:#cfe3ea}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,system-ui,sans-serif;color:var(--ink);background:#fff;min-height:100vh}
header{background:var(--celeste);padding:22px 16px 18px;text-align:center}
header a.back{color:var(--azul-hondo);font-weight:600;text-decoration:none;letter-spacing:.08em;font-size:14px;text-transform:uppercase}
h1{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(36px,7vw,52px);line-height:.9;margin:8px 0 0}
h1 span{color:var(--coral)}
main{max-width:900px;margin:0 auto;padding:24px 16px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.tile{display:block;background:var(--nube);border:2px solid var(--line);border-radius:22px;padding:20px;color:inherit;text-decoration:none}
.tile:hover,.tile:focus-visible{border-color:var(--azul);outline:none}
.tile h2{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:28px;line-height:.95;margin:0 0 8px}
.tile p{margin:0 0 12px;font-size:17px}
.tile .go{font-weight:700;color:var(--azul-hondo)}
.tile .go::after{content:" ↗"}
footer{text-align:center;font-size:14px;color:#4b6670;padding:0 16px 24px}
</style>
</head>
<body>
<header>
  <a class="back" href="../">← Manu en clase</a>
  <h1>Juegos <span>de aula</span></h1>
</header>
<main>
  <a class="tile" href="../transporte/" target="_blank" rel="noopener">
    <h2>Medios de transporte</h2>
    <p>Clasifica los vehículos por color o por tipo. Para tablet y pizarra digital, con o sin voz.</p>
    <span class="go">Jugar</span>
  </a>
  <a class="tile" href="../#juego" target="_blank" rel="noopener">
    <h2>Busca el material</h2>
    <p>Lee la palabra y toca su pictograma. Con voz y ayuda tras dos fallos.</p>
    <span class="go">Jugar</span>
  </a>
</main>
<footer>manuenclase.com</footer>
</body>
</html>
